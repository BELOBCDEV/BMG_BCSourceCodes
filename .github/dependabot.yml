# .github/dependabot.yml
# Keeps dependencies patched automatically via PRs.
# Add or adjust ecosystems to match what the project actually uses.

version: 2
updates:
  # GitHub Actions used by this repo's workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

